# Usage and options: see README.md
# Folder paths come from .env (copy .env.example to .env).
services:
  converter:
    build: .
    image: pdf-converter
    command: node dist/convertFolderOfPdfs.js /inPdfs /outCbz
    volumes:
      - ${PDF_IN:?Set PDF_IN in .env (see .env.example)}:/inPdfs:ro
      - ${CBZ_OUT:?Set CBZ_OUT in .env (see .env.example)}:/outCbz
      - ${HOST_TMP:?Set HOST_TMP in .env (see .env.example)}:/tmp
